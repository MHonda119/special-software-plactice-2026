interface:
  display_name: "GitHub Issue Plan Document"
  short_description: "Write cross-stack Issue plans to docs/design-docs"
  default_prompt: "Use $plan-issue to read this Issue through GitHub MCP, write an ordered, verifiable plan to docs/design-docs/<title>.md, and return the document link without implementing code."
dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "Read issues and comments through the configured GitHub MCP server"
