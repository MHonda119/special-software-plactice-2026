apiVersion: v1
kind: ConfigMap
metadata:
  name: lecture-env
  namespace: lecture
data:
  # Django
  DJANGO_SECRET_KEY: "unsafe"
  # DB
  POSTGRES_DB: "lecture"
  POSTGRES_USER: "lecture"
  POSTGRES_PASSWORD: "lecture"
  # NOTE: backend settings.py is currently fixed to HOST=db, PORT=5432.
  # Keep service name as "db" to match.

  # Backend runtime
  LLM_REQUEST_TIMEOUT: "60"
  # For in-cluster access to Ollama service
  OLLAMA_BASE_URL: "http://ollama:11434"

  # Optional (RAG/Chroma)
  CHROMA_PERSIST_DIR: "/data/chroma"
